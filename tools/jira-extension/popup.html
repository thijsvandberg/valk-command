<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open in Bridge</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        width: 232px;
        background: #ffffff;
        color: #05403d;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: #075854;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border: 1px solid #6dd4d1;
        border-radius: 8px;
        font-size: 13px;
        color: #05403d;
        outline: none;
      }
      input:focus {
        border-color: #0e8e88;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 8px;
        background: #0e8e88;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 120ms ease;
      }
      button:hover {
        background: #0a736e;
      }
      button:active {
        background: #075854;
      }
      .status {
        margin-top: 8px;
        min-height: 16px;
        font-size: 11px;
        color: #0a736e;
      }
    </style>
  </head>
  <body>
    <h1>Open in Bridge</h1>
    <label for="port">Bridge port</label>
    <input id="port" type="number" min="1" max="65535" inputmode="numeric" />
    <button id="save" type="button">Save</button>
    <div class="status" id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
